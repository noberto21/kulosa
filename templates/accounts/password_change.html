{% extends "base.html" %}
{% block title %}Change password | KULOSA{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">Change password</h1>
  <form method="post" class="mt-6 rounded-xl bg-white p-6 shadow-sm ring-1 ring-navy-900/10" novalidate>
    {% csrf_token %}
    {% include "partials/_form.html" %}
    <button type="submit" class="btn btn-primary mt-6 w-full">Change password</button>
  </form>
</div>
{% endblock %}
