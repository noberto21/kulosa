{% extends "base.html" %}
{% block title %}Reset your password | KULOSA{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">Reset your password</h1>
  <p class="mt-2 text-sm text-navy-700">Enter your account email and we'll send a link to choose a new password.</p>
  <form method="post" class="mt-6 rounded-xl bg-white p-6 shadow-sm ring-1 ring-navy-900/10" novalidate>
    {% csrf_token %}
    {% include "partials/_form.html" %}
    <button type="submit" class="btn btn-primary mt-6 w-full">Send reset link</button>
  </form>
</div>
{% endblock %}
