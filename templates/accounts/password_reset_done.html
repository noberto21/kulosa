{% extends "base.html" %}
{% block title %}Check your email | KULOSA{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">Check your email</h1>
  <p class="mt-3 text-navy-700">If an account exists for that address, a reset link is on its way. It stays valid for 3 hours.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-outline mt-6">Back to login</a>
</div>
{% endblock %}
